[project]
name = "boxwright"
version = "0.1.0"
description = "A small language model that designs solvable Sokoban levels at a requested difficulty"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["boxwright"]

[tool.pytest.ini_options]
testpaths = ["tests"]
