[project]
name = "boxwright"
version = "0.1.0"
description = "A small language model that designs solvable Sokoban levels at a requested difficulty"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["boxwright-solver"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
boxwright-solver = { path = "solver" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["boxwright"]

[tool.pytest.ini_options]
testpaths = ["tests"]
