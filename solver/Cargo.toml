[package]
name = "boxwright-solver"
version = "0.1.0"
edition = "2024"

[lib]
name = "boxwright_solver"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29.3", features = ["extension-module", "abi3-py312"], optional = true }
rayon = { version = "1.12.0", optional = true }
rustc-hash = "2.1.3"

[features]
default = ["parallel"]
parallel = ["dep:rayon"]
python = ["dep:pyo3", "parallel"]
